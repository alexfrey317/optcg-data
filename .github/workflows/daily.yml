name: daily-ingest

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (3 am Central), after Card Kaizoku's ~07:00 UTC publish of the previous day's files
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # Card Kaizoku per-player pulls are rate limited and can take an hour
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Card Kaizoku cache (skip unchanged snapshots)
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Restore per-player files (regenerated each run; fallback if a source fails)
        uses: actions/cache@v4
        with:
          path: |
            data/latest/profiles
            data/latest/matches
            data/latest/players
            data/latest/curves
            data/windows
          key: perplayer-${{ github.run_id }}
          restore-keys: perplayer-

      - name: Ingest
        id: ingest
        env:
          OPB_FS_EMAIL: ${{ secrets.OPB_FS_EMAIL }}
          OPB_FS_PASSWORD: ${{ secrets.OPB_FS_PASSWORD }}
        run: python -m ingest.run

      - name: Upload raw snapshots (90-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest-bot@users.noreply.github.com"
          # data/ is a snapshot owned by this job: commit it on top of whatever main is now instead of rebasing, so
          # files that dropped out of the snapshot (modify/delete) can never conflict with a code push made mid-run
          for attempt in 1 2 3; do
            git fetch origin main
            git reset -q origin/main
            git add -A data
            if git diff --cached --quiet; then echo "no changes"; break; fi
            git commit -q -m "chore: data snapshot $(date -u +%F)"
            git push origin HEAD:main && break
            echo "push rejected, retrying ($attempt)"
          done
          # sync the working tree with the committed code so the site builds from current main
          git checkout -- .

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        run: npm ci && npm run build
        working-directory: site

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name optcg-data --branch main --commit-dirty=true
        working-directory: site

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Ingest failed ${new Date().toISOString().slice(0,10)}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'ingest' });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({ ...context.repo, title, labels: ['ingest'],
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
